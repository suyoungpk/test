      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;

      .sr-only:focus,
      .sr-only:hover {
        position: static;
        width: auto;
        height: auto;
        clip: none;

        outline: 2px solid #000;
      }
    </style>
